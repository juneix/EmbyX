name: Android APK 构建与发布

# 触发条件：
# 1. 每次推送代码到 main 分支：自动构建并更新名为 "preview" 的 Pre-release (Rolling Release)
# 2. 推送 v* 格式的 tag（如 v1.0）：自动构建并发布正式 Release
# 3. 手动触发（workflow_dispatch）：手动指定 tag 发布
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到已有标签 (如 v1.0)'
        required: true
        default: 'v1.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APKs & Publish Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Capacitor dependencies
        run: npm install

      # 解码 Android 签名证书
      - name: Decode Android Keystore
        run: |
          mkdir -p key
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > key/embyx.jks

      # ── 1. 构建中文版 APK ──────────────────────────────────────────────────────────
      - name: Create capacitor.config.json (zh)
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "juneix.embyx",
            "appName": "EmbyX",
            "webDir": "zh",
            "backgroundColor": "#000000",
            "server": {
              "androidScheme": "http",
              "cleartext": true
            },
            "plugins": {
              "SplashScreen": {
                "launchAutoHide": true,
                "backgroundColor": "#000000",
                "androidScaleType": "CENTER",
                "showSpinner": false
              }
            }
          }
          EOF

      - name: Add & Sync Android Platform (zh)
        run: |
          npx cap add android
          npx cap sync android

      - name: Patch Android Project (zh)
        run: python .github/patch_android.py --lang zh

      - name: Build Debug APK (zh)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Move and Rename to EmbyX-zh.apk
        run: mv android/app/build/outputs/apk/debug/app-debug.apk EmbyX-zh.apk

      # ── 2. 构建英文版 APK ──────────────────────────────────────────────────────────
      - name: Create capacitor.config.json (en)
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "juneix.embyx",
            "appName": "EmbyX",
            "webDir": "en",
            "backgroundColor": "#000000",
            "server": {
              "androidScheme": "http",
              "cleartext": true
            },
            "plugins": {
              "SplashScreen": {
                "launchAutoHide": true,
                "backgroundColor": "#000000",
                "androidScaleType": "CENTER",
                "showSpinner": false
              }
            }
          }
          EOF

      - name: Sync Android Platform (en)
        run: npx cap sync android

      - name: Patch Android Project (en)
        run: python .github/patch_android.py --lang en

      - name: Build Debug APK (en)
        run: |
          cd android
          ./gradlew assembleDebug
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Move and Rename to EmbyX-en.apk
        run: mv android/app/build/outputs/apk/debug/app-debug.apk EmbyX-en.apk

      # ── 3. 校验并直接发布到 GitHub Release ───────────────────────────────────────
      - name: Verify APK files exist
        run: |
          test -f "EmbyX-zh.apk"
          test -f "EmbyX-en.apk"
          ls -lh EmbyX-*.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # 如果是 main 分支，固定使用 preview 标签以便滚动更新
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (github.ref_name == 'main' && 'preview' || github.ref_name) }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (github.ref_name == 'main' && 'EmbyX Preview' || github.ref_name) }}
          prerelease: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            EmbyX-zh.apk
            EmbyX-en.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
